.d-italic{font-style:italic}
.d-comp{font-size:10.5px;font-style:italic;fill:#5b6470}
.d-frame{fill:none;stroke:#111418;stroke-width:1}
.d-frame-tab{fill:#ffffff;stroke:#111418;stroke-width:1}
.d-sym .d-shape{fill:#f4f8fd;stroke:#111418}
.d-sym .d-rule,.d-sym .d-stick{stroke:#111418}
.d-sym.c-b .d-shape{fill:#fdf8ee;stroke:#111418}
.d-sym.c-b .d-rule,.d-sym.c-b .d-stick{stroke:#111418}
.d-sym.c-c .d-shape{fill:#fbf3f6;stroke:#111418}
.d-sym.c-c .d-rule,.d-sym.c-c .d-stick{stroke:#111418}
.d-sym.c-n .d-shape{fill:#fffbe6;stroke:#5b6470}
