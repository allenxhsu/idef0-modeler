</style><rect x="-26" y="-36" width="2082" height="532" fill="#fff"/><rect class="d-frame" x="-10" y="-20" width="2050" height="500"/><path class="d-frame-tab" d="M-10 -20h206.2v14l-10 10H-10z"/><text class="d-mono" x="0" y="-4">req [package] Rules [Rules]</text><g class="d-symbols"><g class="d-sym c-b" data-sym="sy_058" transform="translate(40 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">FIPS 183 syntax</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;ID1&quot;</text><text x="10" y="80">text = &quot;A-0 shall hold exactly one box; a</text><text x="10" y="96">decomposition 3–6; every box a control and an</text><text x="10" y="112">output; every arrow a label.&quot;</text></g><g class="d-sym c-b" data-sym="sy_059" transform="translate(370 40)"><rect class="d-shape" width="304" height="120"/><text class="d-mono" x="152" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="152" y="36" text-anchor="middle">Stable rule codes</text><path class="d-rule" d="M0 46H304"/><text x="10" y="64">id = &quot;ID3&quot;</text><text x="10" y="80">text = &quot;Every finding shall carry a code shared</text><text x="10" y="96">by the web panel, the Mac panel and idef0</text><text x="10" y="112">validate --json.&quot;</text></g><g class="d-sym c-b" data-sym="sy_060" transform="translate(700 40)"><rect class="d-shape" width="300" height="104"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Every name is a concept</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;ID2&quot;</text><text x="10" y="80">text = &quot;Every named box and labelled arrow</text><text x="10" y="96">shall be bound to a glossary concept.&quot;</text></g><g class="d-sym c-b" data-sym="sy_061" transform="translate(1030 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Web and Swift agree</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;ID4&quot;</text><text x="10" y="80">text = &quot;The Swift port shall read, write and</text><text x="10" y="96">check a model byte for byte as the web</text><text x="10" y="112">modules do.&quot;</text></g><g class="d-sym c-b" data-sym="sy_062" transform="translate(1360 40)"><rect class="d-shape" width="300" height="120"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Times are never invented</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;ID5&quot;</text><text x="10" y="80">text = &quot;An element with no updatedAt or</text><text x="10" y="96">deletedAt shall be written back with none, so</text><text x="10" y="112">an older file saves byte for byte.&quot;</text></g><g class="d-sym c-b" data-sym="sy_063" transform="translate(1690 40)"><rect class="d-shape" width="300" height="104"/><text class="d-mono" x="150" y="19" text-anchor="middle">«requirement»</text><text class="d-name" x="150" y="36" text-anchor="middle">Screen equals export</text><path class="d-rule" d="M0 46H300"/><text x="10" y="64">id = &quot;ID6&quot;</text><text x="10" y="80">text = &quot;What is drawn on screen shall be</text><text x="10" y="96">exactly what lands in the SVG, PNG and PDF.&quot;</text></g><g class="d-sym " data-sym="sy_064" transform="translate(210 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Rule checker</text></g><g class="d-sym " data-sym="sy_065" transform="translate(700 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Concept registry</text></g><g class="d-sym " data-sym="sy_066" transform="translate(1030 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Swift core</text></g><g class="d-sym " data-sym="sy_067" transform="translate(1360 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Native format</text></g><g class="d-sym " data-sym="sy_068" transform="translate(1690 320)"><rect class="d-shape" width="200" height="50"/><text class="d-mono" x="100" y="19" text-anchor="middle">«block»</text><text class="d-name" x="100" y="36" text-anchor="middle">Renderer</text></g></g><g class="d-paths"><g class="d-path" data-path="pa_058"><path class="d-hit" d="M277 320L277 240L190 240L190 160"/><path class="d-line dashed" d="M277 320L277 240L190 240L190 160"/><path class="d-head" transform="translate(190 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="199.8" y="222" width="67.4" height="15"/><text class="d-mono" x="233.5" y="233" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_059"><path class="d-hit" d="M343 320L343 240L522 240L522 160"/><path class="d-line dashed" d="M343 320L343 240L522 240L522 160"/><path class="d-head" transform="translate(522 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="398.8" y="222" width="67.4" height="15"/><text class="d-mono" x="432.5" y="233" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_060"><path class="d-hit" d="M800 320L800 232L850 232L850 144"/><path class="d-line dashed" d="M800 320L800 232L850 232L850 144"/><path class="d-head" transform="translate(850 144) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="806" y="269" width="67.4" height="15"/><text class="d-mono" x="839.7" y="280" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_061"><path class="d-hit" d="M1130 320L1130 240L1180 240L1180 160"/><path class="d-line dashed" d="M1130 320L1130 240L1180 240L1180 160"/><path class="d-head" transform="translate(1180 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1136" y="273" width="67.4" height="15"/><text class="d-mono" x="1169.7" y="284" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_062"><path class="d-hit" d="M1460 320L1460 240L1510 240L1510 160"/><path class="d-line dashed" d="M1460 320L1460 240L1510 240L1510 160"/><path class="d-head" transform="translate(1510 160) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1466" y="273" width="67.4" height="15"/><text class="d-mono" x="1499.7" y="284" text-anchor="middle">«satisfy»</text></g><g class="d-path" data-path="pa_063"><path class="d-hit" d="M1790 320L1790 232L1840 232L1840 144"/><path class="d-line dashed" d="M1790 320L1790 232L1840 232L1840 144"/><path class="d-head" transform="translate(1840 144) rotate(-90)" d="M-11 -5L0 0L-11 5"/><rect class="d-label-bg" x="1796" y="269" width="67.4" height="15"/><text class="d-mono" x="1829.7" y="280" text-anchor="middle">«satisfy»</text></g></g><g class="d-ports"></g></svg>
