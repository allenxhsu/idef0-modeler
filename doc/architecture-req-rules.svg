<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -36 2082 532" width="2082" height="532"><style>
text{font-family:Helvetica, Arial, sans-serif;font-size:12px;fill:#111418;dominant-baseline:auto}
.d-mono{font-family:Menlo, Consolas, monospace;font-size:11px;fill:#2d343c}
